[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "serein-cli"
description = "Command line tool for the Serein shell (a fork of caelestia-cli)"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
serein = "serein:main"

[tool.hatch.version]
source = "vcs"

# No release tags in the fork yet; fall back to this until one is created
[tool.hatch.version.raw-options]
fallback_version = "0.1.1"

[tool.hatch.build.targets.wheel]
packages = ["src/serein"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "completions",
    "README.md"
]

[tool.ruff]
line-length = 120
